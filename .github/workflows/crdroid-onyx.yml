#
# crDroid 16.0 for onyx (POCO F7), built on foss.crave.io.
#
# Design notes, because several of these are load-bearing:
#
#  * Everything heavy runs on a *self-hosted* runner inside the crave devspace.
#    The only GitHub-hosted job is `wake`, which makes one crave API call and
#    exits in seconds. That is deliberate: upstream crave_aosp_builder
#    documents users losing Actions access under the Additional Product Terms
#    clause about using Actions "solely to interact with 3rd party websites...
#    or for general computing purposes". Upstream's `test` job (repo init +
#    repo sync on ubuntu-latest) is intentionally not carried over.
#
#  * No `repo` and no `make` ever run in the devspace -- the crave rules forbid
#    it, and installing the repo tool there is treated as circumvention. The
#    project is selected with an explicit --projectID, and every repo/make call
#    happens on the build server inside ci/crave-build.sh.
#
#  * Artifacts are pulled to the devspace and uploaded from the runner with the
#    ephemeral per-job GITHUB_TOKEN. crave's own /opt/crave/github-actions/
#    upload.sh is deliberately avoided: it requires writing a GitHub PAT to
#    token.txt on the build node, which is shared infrastructure.
#
# Rules: https://github.com/FOSSonTop/crave/blob/master/rules.md
#
name: crDroid 16.0 - onyx

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Sync + patch + breakfast only, no compile'
        type: boolean
        default: false
      clean:
        description: 'Clean build - only with a real reason (crave rules)'
        type: boolean
        default: false
      kernel_release_tag:
        description: 'konoha-kernel-gki release tag (blank = latest)'
        type: string
        default: ''
      publish:
        description: 'Publish the zip as a GitHub release'
        type: boolean
        default: true
  schedule:
    # Saturday 03:17 UTC. Deliberately off the hour: on-the-hour crons all
    # arrive in the crave queue at once.
    - cron: '17 3 * * 6'

# "One account can only trigger one build at once" -- crave queue rules. This is
# what stops the weekly cron from overlapping a manual dispatch. Queue, do not
# cancel: cancelling mid-build wastes a build server's time.
concurrency:
  group: crave-build
  cancel-in-progress: false

env:
  CRAVE_PROJECT_ID: '93'
  # Must match the project name on the crave dashboard exactly. It is
  # "LOS 22.1" -- upstream's crave.yaml template says "LOS 22", which silently
  # no-ops and loses workspace persistence.
  CRAVE_PROJECT_NAME: 'LOS 22.1'
  # Workspace persistence on crave keys on (project UUID, user ID, this
  # directory name, hostname signature). So this path must never change, and
  # ignoreClientHostname below neutralises the hostname factor.
  PROJECTFOLDER: /crave-devspaces/Lineage22
  DEVICE: onyx
  PATCHES_REPO: https://github.com/Loukious/crdroid_onyx_patches
  PATCHES_BRANCH: crdroid-16.0

jobs:
  wake:
    name: Wake devspace, ensure runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install the crave CLI
        run: |
          curl -fsS https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mkdir -p "$HOME/bin"
          mv ./crave "$HOME/bin/crave"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write crave.conf
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          umask 077
          jq -n --arg u "$CRAVE_USERNAME" --arg t "$CRAVE_TOKEN" '{
            username: $u,
            headers: {
              "Content-Type": "application/json",
              Authorization: $t,
              "User-Agent": "Crave"
            },
            projects: [],
            server: "https://foss.crave.io/api"
          }' > "$HOME/crave.conf"

      - name: Ensure the self-hosted runner is listening
        run: |
          crave -n devspace -- \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/ensure-runner.sh | bash"

  build:
    name: Sync, patch, build
    needs: wake
    runs-on: [self-hosted, crave, onyx]
    timeout-minutes: 1440
    permissions:
      contents: write        # solely to publish the release
    steps:
      - name: Prepare the crave workspace
        run: |
          set -euo pipefail
          # Just the directory and crave.yaml. No repo init here on purpose --
          # crave is told the project with --projectID instead.
          mkdir -p "$PROJECTFOLDER/.repo/manifests"
          printf '%s\n' "\"$CRAVE_PROJECT_NAME\":" '  ignoreClientHostname: true' \
            > "$PROJECTFOLDER/.repo/manifests/crave.yaml"
          cat "$PROJECTFOLDER/.repo/manifests/crave.yaml"

      - name: Sync, patch and build through crave run
        env:
          SYNC_ONLY: ${{ inputs.sync_only == true && '1' || '0' }}
          KERNEL_RELEASE_TAG: ${{ inputs.kernel_release_tag }}
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd "$PROJECTFOLDER"

          CLEAN=''
          if [ "${{ inputs.clean }}" = 'true' ]; then
            echo "::warning::--clean requested. crave rules: only with a legitimate reason."
            CLEAN='--clean'
          fi

          # One short command string: clone the recipe, exec it. The recipe
          # itself lives in ci/crave-build.sh so there is no giant quoted blob
          # here to get wrong. /tmp is safe to rm -rf; the ROM source is not.
          REMOTE="rm -rf /tmp/onyx-ci"
          REMOTE="$REMOTE && git clone --depth 1 -b $PATCHES_BRANCH $PATCHES_REPO /tmp/onyx-ci"
          REMOTE="$REMOTE && DEVICE=$DEVICE SYNC_ONLY=$SYNC_ONLY"
          REMOTE="$REMOTE KERNEL_RELEASE_TAG='$KERNEL_RELEASE_TAG'"
          REMOTE="$REMOTE BUILD_USERNAME=${{ github.actor }}"
          REMOTE="$REMOTE bash /tmp/onyx-ci/ci/crave-build.sh"

          echo "remote command: $REMOTE"
          crave -n run --projectID "$CRAVE_PROJECT_ID" --no-patch --no-artifacts $CLEAN -- "$REMOTE"

      - name: Pull the zip off the build server
        if: ${{ inputs.sync_only != true }}
        id: pull
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd "$PROJECTFOLDER"
          OUT="$RUNNER_TEMP/artifacts"
          rm -rf "$OUT"; mkdir -p "$OUT"

          crave -n pull --destination "$OUT" "out/target/product/$DEVICE/crDroidAndroid-*.zip"

          ZIP="$(find "$OUT" -type f -name 'crDroidAndroid-*.zip' | sort | tail -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::crave pull produced no zip"
            find "$OUT" -type f | head -50
            exit 1
          fi
          ( cd "$(dirname "$ZIP")" && sha256sum "$(basename "$ZIP")" > "$(basename "$ZIP").sha256" )

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          {
            echo "### Build artifact"
            echo
            echo "- \`$(basename "$ZIP")\` ($(du -h "$ZIP" | cut -f1))"
            echo "- sha256 \`$(cut -d' ' -f1 < "$ZIP.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ inputs.sync_only != true && inputs.publish != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.pull.outputs.zip }}
          NAME: ${{ steps.pull.outputs.name }}
        run: |
          set -euo pipefail
          GH="$HOME/bin/gh"
          command -v gh >/dev/null 2>&1 && GH=gh
          TAG="onyx-$(date -u +%Y%m%d)-${{ github.run_number }}"

          "$GH" release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "crDroid 16.0 - onyx - $(date -u +%Y-%m-%d)" \
            --notes "Unofficial crDroid 16.0 for onyx (POCO F7).

          PixelOS GApps and Launcher, LHDC A2DP codec, gesture navigation space,
          Google AI Wallpapers fix, Kono-Ha GKI kernel with KernelSU Next
          (charging bypass off), OS3.0.302.0 firmware.

          Built from crDroid 16.0 HEAD by [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            || echo "release $TAG already exists, uploading into it"

          "$GH" release upload "$TAG" \
            --repo "${{ github.repository }}" --clobber \
            "$ZIP" "$ZIP.sha256"

      # "Be mindful of Devspace CLI Storage. Clean up your .zip and .img build
      # artefacts if you're used to pulling them to devspace" -- crave rules.
      # Note this only removes what we pulled *to the devspace*; the build
      # server's out/ is left alone so the next build stays incremental.
      - name: Remove the pulled artifacts from the devspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/artifacts"
