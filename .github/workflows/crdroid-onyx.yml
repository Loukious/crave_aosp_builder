#
# Evolution X 16.0 (bka) for onyx (POCO F7), built on foss.crave.io.
# (Historical name: this file started life as the crDroid 16.0 workflow.)
#
# Design notes, because several of these are load-bearing:
#
#  * Everything heavy runs on a *self-hosted* runner inside the crave devspace.
#    The only GitHub-hosted job is `wake`, which makes one crave API call and
#    exits in seconds. That is deliberate: upstream crave_aosp_builder
#    documents users losing Actions access under the Additional Product Terms
#    clause about using Actions "solely to interact with 3rd party websites...
#    or for general computing purposes". Upstream's `test` job (repo init +
#    repo sync on ubuntu-latest) is intentionally not carried over.
#
#  * No `repo sync` and no `make` ever run in the devspace -- the crave rules
#    forbid both, and installing the repo tool there is treated as
#    circumvention. The one exception is a single guarded `repo init`, which
#    the rules themselves prescribe and which the crave CLI needs in order to
#    identify the workspace at all (see "Prepare the crave workspace"). Every
#    sync and every make happens on the build server, inside ci/crave-build.sh.
#
#  * Artifacts are pulled to the devspace and uploaded from the runner with the
#    ephemeral per-job GITHUB_TOKEN. crave's own /opt/crave/github-actions/
#    upload.sh is deliberately avoided: it requires writing a GitHub PAT to
#    token.txt on the build node, which is shared infrastructure.
#
# Rules: https://github.com/FOSSonTop/crave/blob/master/rules.md
#
name: Evolution X 16.0 - onyx

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Sync + patch + breakfast only, no compile'
        type: boolean
        default: false
      clean:
        description: 'Clean build - only with a real reason (crave rules)'
        type: boolean
        default: false
      kernel_release_tag:
        description: 'konoha-kernel-gki release tag (blank = latest)'
        type: string
        default: ''
      patches_branch:
        description: 'crdroid_onyx_patches branch: evolution-cnb (A17, weekly default) or evolution-bka (frozen A16)'
        type: string
        default: 'evolution-cnb'
      publish:
        description: 'Publish a GitHub release (checksum + SourceForge link)'
        type: boolean
        default: true
      feed_primary:
        description: 'OTA feed download URL: fd = FileDitch landing (needs the Updater with FileDitchResolver installed!), sf = SourceForge direct'
        type: choice
        default: 'fd'
        options:
          - 'sf'
          - 'fd'
  schedule:
    # Saturday 03:17 UTC. Deliberately off the hour: on-the-hour crons all
    # arrive in the crave queue at once.
    - cron: '17 3 * * 6'

# "One account can only trigger one build at once" -- crave queue rules. This is
# what stops the weekly cron from overlapping a manual dispatch. Queue, do not
# cancel: cancelling mid-build wastes a build server's time.
concurrency:
  group: crave-build
  cancel-in-progress: false

env:
  CRAVE_PROJECT_ID: '93'
  # Must match the project name on the crave dashboard exactly. It is
  # "LOS 22.1" -- upstream's crave.yaml template says "LOS 22", which silently
  # no-ops and loses workspace persistence.
  CRAVE_PROJECT_NAME: 'LOS 22.1'
  # Workspace persistence on crave keys on (project UUID, user ID, this
  # directory name, hostname signature). So this path must never change, and
  # ignoreClientHostname below neutralises the hostname factor.
  PROJECTFOLDER: /crave-devspaces/Lineage22
  DEVICE: onyx
  PATCHES_REPO: https://github.com/Loukious/crdroid_onyx_patches
  # Weekly + default = evolution-cnb (A17) since 2026-09-05 -- the A16/bka
  # stack is frozen; dispatch with patches_branch=evolution-bka to build it.
  # The OTA feed push follows this variable too, so each branch's builds
  # land in its own ota/onyx.json.
  PATCHES_BRANCH: ${{ inputs.patches_branch || 'evolution-cnb' }}

jobs:
  wake:
    name: Wake devspace, ensure runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install the crave CLI
        run: |
          curl -fsS https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mkdir -p "$HOME/bin"
          mv ./crave "$HOME/bin/crave"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write crave.conf
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          umask 077
          jq -n --arg u "$CRAVE_USERNAME" --arg t "$CRAVE_TOKEN" '{
            username: $u,
            headers: {
              "Content-Type": "application/json",
              Authorization: $t,
              "User-Agent": "Crave"
            },
            projects: [],
            server: "https://foss.crave.io/api"
          }' > "$HOME/crave.conf"

      - name: Ensure the self-hosted runner is listening
        run: |
          crave -n devspace -- \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/ensure-runner.sh | bash"

  build:
    name: Sync, patch, build
    needs: wake
    runs-on: [self-hosted, crave, onyx]
    timeout-minutes: 1440
    permissions:
      contents: write        # solely to publish the release
    steps:
      - name: Prepare the crave workspace
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          # --projectID is NOT enough. The crave CLI still resolves *which
          # workspace* a command applies to by walking up from $PWD for a
          # .repo and reading the manifest remote out of it; with only a
          # hand-made .repo/manifests/crave.yaml it dies two seconds in with
          # "Error: Could not get project root/url". That is exactly how run
          # 32906601281 failed. So the workspace gets repo-init'ed once.
          #
          # This is `repo init` and nothing else. The rules forbid `repo sync`
          # in the devspace ("Do not use repo sync, use crave run instead")
          # and explicitly show `repo init ... --depth 1` as the command you
          # are meant to run. /usr/bin/repo is a root-owned shim preinstalled
          # by crave -- we install nothing, which is the part that gets people
          # banned. Costs ~20MB and only ever runs once per devspace.
          mkdir -p "$PROJECTFOLDER"
          cd "$PROJECTFOLDER"
          git config --global --get user.email >/dev/null 2>&1 || \
            git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --global --get user.name >/dev/null 2>&1 || \
            git config --global user.name "${{ github.repository_owner }}"
          if [ ! -d .repo/manifests.git ]; then
            repo init -u https://github.com/accupara/los22.git -b lineage-22.1 \
                      --git-lfs --depth 1
          fi

          # Written after repo init, since init rewrites .repo/manifests.
          # The key must be the exact dashboard project name: upstream's
          # template says "LOS 22", which silently no-ops and loses workspace
          # persistence.
          printf '%s\n' "\"$CRAVE_PROJECT_NAME\":" '  ignoreClientHostname: true' \
            > .repo/manifests/crave.yaml
          cat .repo/manifests/crave.yaml

      - name: Preflight the patch set before spending queue time
        env:
          KERNEL_RELEASE_TAG: ${{ inputs.kernel_release_tag }}
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          # crave's queue is the expensive part, not the build. Run 32950868319
          # sat in the queue for three hours and then failed in 3m55s, in the
          # kernel staging step, for a reason that was knowable up front. So
          # everything checkable WITHOUT a synced tree is checked here first:
          # the patch files parse, every patches/ dir has a project mapping, the
          # OTA template still carries the unofficial identity, and the kernel
          # asset actually resolves, downloads and yields a valid arm64 Image.
          #
          # This runs on the self-hosted runner inside the devspace, so it adds
          # nothing to the GitHub-hosted footprint (still just the one API call
          # in the wake job) and nothing to the crave queue. Takes a few seconds.
          rm -rf /tmp/onyx-preflight
          git clone --depth 1 -b "$PATCHES_BRANCH" "$PATCHES_REPO" /tmp/onyx-preflight
          DEVICE="$DEVICE" KERNEL_RELEASE_TAG="$KERNEL_RELEASE_TAG" \
            bash /tmp/onyx-preflight/apply.sh --preflight
          rm -rf /tmp/onyx-preflight

      - name: Sync, patch and build through crave run
        env:
          SYNC_ONLY: ${{ inputs.sync_only == true && '1' || '0' }}
          KERNEL_RELEASE_TAG: ${{ inputs.kernel_release_tag }}
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd "$PROJECTFOLDER"

          CLEAN=''
          if [ "${{ inputs.clean }}" = 'true' ]; then
            echo "::warning::--clean requested. crave rules: only with a legitimate reason."
            CLEAN='--clean'
          fi

          # One short command string: clone the recipe, exec it. The recipe
          # itself lives in ci/crave-build.sh so there is no giant quoted blob
          # here to get wrong. /tmp is safe to rm -rf; the ROM source is not.
          REMOTE="rm -rf /tmp/onyx-ci"
          REMOTE="$REMOTE && git clone --depth 1 -b $PATCHES_BRANCH $PATCHES_REPO /tmp/onyx-ci"
          REMOTE="$REMOTE && DEVICE=$DEVICE SYNC_ONLY=$SYNC_ONLY"
          REMOTE="$REMOTE KERNEL_RELEASE_TAG='$KERNEL_RELEASE_TAG'"
          REMOTE="$REMOTE bash /tmp/onyx-ci/ci/crave-build.sh"

          echo "remote command: $REMOTE"
          crave -n run --projectID "$CRAVE_PROJECT_ID" --no-patch --no-artifacts $CLEAN -- "$REMOTE"

      - name: Pull the zip off the build server
        if: ${{ inputs.sync_only != true }}
        id: pull
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd "$PROJECTFOLDER"
          OUT="$RUNNER_TEMP/artifacts"
          rm -rf "$OUT"; mkdir -p "$OUT"

          crave -n pull --destination "$OUT" "out/target/product/$DEVICE/EvolutionX-*.zip"

          ZIP="$(find "$OUT" -type f -name 'EvolutionX-*.zip' | sort | tail -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::crave pull produced no zip"
            find "$OUT" -type f | head -50
            exit 1
          fi
          ( cd "$(dirname "$ZIP")" && sha256sum "$(basename "$ZIP")" > "$(basename "$ZIP").sha256" )

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          {
            echo "### Build artifact"
            echo
            echo "- \`$(basename "$ZIP")\` ($(du -h "$ZIP" | cut -f1))"
            echo "- sha256 \`$(cut -d' ' -f1 < "$ZIP.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ inputs.sync_only != true && inputs.publish != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SourceForge hosting for the ROM zip. GitHub release assets are
          # capped at 2 GiB and this zip is ~4.7 GB, so the zip itself can
          # never live on GitHub -- the GitHub release carries only the
          # checksum and a link. Secrets: SF_SSH_KEY (private OpenSSH key),
          # SF_USER (SourceForge username), SF_PROJECT (project unix name).
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          # Push access to Loukious/crdroid_onyx_patches, where the OTA feed
          # (ota/onyx.json -- the URL the in-ROM Updater fetches) lives.
          # GITHUB_TOKEN is scoped to this repo only, so it cannot push there.
          PATCHES_TOKEN: ${{ secrets.PATCHES_TOKEN }}
          PATCHES_SLUG: ${{ github.repository_owner }}/crdroid_onyx_patches
          # Pinned frs.sourceforge.net host key (ssh-keyscan, 2026-08-30) so
          # strict checking works without TOFU on a shared devspace runner.
          SF_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC
          # Mirror pinned in the feed URL: auto-selection routed to
          # "unlimited" at ~5 MB/s here; "versatile" benchmarked ~7.4 MB/s
          # (20 MB range probes, 2026-08-31). Override per region if needed.
          SF_MIRROR: versatile
          ZIP: ${{ steps.pull.outputs.zip }}
          NAME: ${{ steps.pull.outputs.name }}
        run: |
          set -euo pipefail
          GH="$HOME/bin/gh"
          command -v gh >/dev/null 2>&1 && GH=gh
          TAG="onyx-$(date -u +%Y%m%d)-${{ github.run_number }}"
          SIZE="$(du -h "$ZIP" | cut -f1)"
          SHA256="$(cut -d' ' -f1 < "$ZIP.sha256")"

          # ---- FileDitch upload (primary OTA host) -------------------------
          # Runs concurrently with the SourceForge sftp below: both only read
          # the zip. FileDitch serves the same file at ~12.5 MB/s vs ~7.4 MB/s
          # for the fastest SourceForge mirror, but its download links are
          # minted per-visitor through a browser proof-of-work challenge and
          # expire in minutes -- so the feed points at the *landing* URL and
          # the in-ROM Updater (FileDitchResolver.java) solves the challenge
          # on-device right before downloading. SourceForge stays the
          # permanent archive and the fallback mirror ("download_sf").
          # No auth needed; unattended files are deleted after ~45 days.
          FD_UPLOAD_LOG="$(mktemp)"
          ( curl -fsS --retry 2 --connect-timeout 30 \
              -F "file=@${ZIP}" https://new.fileditch.com/upload.php \
              > "$FD_UPLOAD_LOG" 2>&1 ) &
          FD_PID=$!

          # ---- SourceForge upload ------------------------------------------
          # The runner lives in the devspace, which is shared infrastructure:
          # the key is written to a temp file and removed in the same step, and
          # is never placed anywhere the build servers can see.
          SF_URL=""
          if [ -n "${SF_SSH_KEY:-}" ] && [ -n "${SF_USER:-}" ] && [ -n "${SF_PROJECT:-}" ]; then
            KEY="$(mktemp)"
            printf '%s\n' "$SF_SSH_KEY" > "$KEY"
            chmod 600 "$KEY"
            KHOSTS="$(mktemp)"
            printf 'frs.sourceforge.net %s\n' "$SF_HOST_KEY" > "$KHOSTS"
            SFDEST="/home/frs/project/${SF_PROJECT}"
            if command -v sftp >/dev/null 2>&1; then
              printf 'mkdir "%s"\nput "%s" "%s/%s"\n' \
                "$SFDEST" "$ZIP" "$SFDEST" "$NAME" > /tmp/sf_batch
              # mkdir of an existing dir is not an error to the SF shell; if
              # the batch fails there, retry without the mkdir.
              sftp -b /tmp/sf_batch -o UserKnownHostsFile="$KHOSTS" \
                   -i "$KEY" "${SF_USER}@frs.sourceforge.net" \
                || { printf 'put "%s" "%s/%s"\n' "$ZIP" "$SFDEST" "$NAME" > /tmp/sf_batch
                     sftp -b /tmp/sf_batch -o UserKnownHostsFile="$KHOSTS" \
                          -i "$KEY" "${SF_USER}@frs.sourceforge.net"; }
              rm -f /tmp/sf_batch
            elif command -v scp >/dev/null 2>&1; then
              scp -o UserKnownHostsFile="$KHOSTS" -i "$KEY" \
                  "$ZIP" "${SF_USER}@frs.sourceforge.net:${SFDEST}/${NAME}"
            else
              echo "::error::neither sftp nor scp on the runner"
              rm -f "$KEY" "$KHOSTS"
              exit 1
            fi
            rm -f "$KEY" "$KHOSTS"
            SF_URL="https://sourceforge.net/projects/${SF_PROJECT}/files/${NAME}/download?use_mirror=${SF_MIRROR}"
            echo "uploaded to SourceForge: $SF_URL"
          else
            echo "::warning::SF_SSH_KEY / SF_USER / SF_PROJECT not set -- skipping the SourceForge upload. The release will carry only the checksum; re-upload manually once the secrets exist."
          fi

          wait "$FD_PID" || echo "::warning::FileDitch upload failed -- OTA will use SourceForge"
          FD_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("url",""))' "$FD_UPLOAD_LOG" 2>/dev/null || true)"
          rm -f "$FD_UPLOAD_LOG"
          if [ -n "$FD_URL" ]; then
            echo "uploaded to FileDitch: $FD_URL"
          fi

          # ---- OTA feed: make the in-ROM Updater offer this build -----------
          # The Updater app is patched (patches/packages_apps_Updater) to fetch
          # raw.githubusercontent.com/Loukious/crdroid_onyx_patches/$PATCHES_BRANCH/ota/{device}.json,
          # so publishing an update is just updating that file. Its parser
          # (org.evolution.updater.misc.Utils.parseJsonUpdate) getString()s nine
          # fields and throws on any missing one: timestamp, filename, md5,
          # size, download, version, maintainer, forum, firmware, paypal --
          # all of which are filled here. `timestamp` comes from the zip's
          # own META-INF/com/android/metadata post-timestamp (= ro.build.date.utc),
          # which is exactly what Utils.isCompatible() compares against, so the
          # new build is guaranteed to sort as newer than any previous one.
          # CrDroid's OTA feed is the same pattern: LineageOS-style JSON whose
          # download URLs point at the FileDitch landing page (the patched
          # Updater solves its PoW challenge on-device) with SourceForge as
          # the "download_sf" fallback mirror.
          if [ -n "${FD_URL:-}${SF_URL:-}" ] && [ -n "${PATCHES_TOKEN:-}" ]; then
            # Primary feed URL. IMPORTANT: the *installed* Updater performs
            # the download, so "fd" only works on phones already running a
            # ROM whose Updater has FileDitchResolver -- an FD landing URL in
            # an older Updater fails the download. Default is "fd" (decided
            # 2026-08-31): every phone this feed serves gets the first
            # resolver-Updater build flashed/sideloaded manually once, and
            # SF stays in "download_sf" as the fallback either way. Dispatch
            # with feed_primary=sf only for an interim build aimed at a
            # phone still on the old Updater.
            FEED_PRIMARY='${{ inputs.feed_primary || 'fd' }}'
            if [ "$FEED_PRIMARY" = "fd" ] && [ -n "$FD_URL" ]; then
              FEED_DOWNLOAD="$FD_URL"
            else
              FEED_DOWNLOAD="$SF_URL"
            fi
            DOWNLOAD_SF_LINE=""
            if [ -n "$SF_URL" ] && [ "$SF_URL" != "$FEED_DOWNLOAD" ]; then
              DOWNLOAD_SF_LINE="\"download_sf\": \"$SF_URL\","
            fi
            # post-timestamp: prefer unzip, fall back to python's zipfile --
            # the devspace runner is not guaranteed to have unzip installed.
            OTA_TS="$(
              if command -v unzip >/dev/null 2>&1; then
                unzip -p "$ZIP" META-INF/com/android/metadata | sed -n 's/^post-timestamp=//p'
              else
                python3 -c 'import re,sys,zipfile; m=zipfile.ZipFile(sys.argv[1]).read("META-INF/com/android/metadata").decode(); r=re.search(r"^post-timestamp=(\d+)",m,re.M); print(r.group(1) if r else "",end="")' "$ZIP"
              fi
            )"
            [ -n "$OTA_TS" ] || { echo "::error::no post-timestamp in $NAME metadata"; exit 1; }
            VERSION="$(echo "$NAME" | sed -n 's/.*-onyx-\([0-9.]*\)-Unofficial\.zip/\1/p')"
            [ -n "$VERSION" ] || { echo "::error::could not parse version from $NAME"; exit 1; }
            SIZE_BYTES="$(stat -c %s "$ZIP")"

            OTA="$(mktemp --suffix=.json)"
            cat > "$OTA" <<EOF
          {
            "response": [
              {
                "maintainer": "Loukious",
                "oem": "Xiaomi",
                "device": "POCO F7",
                "filename": "$NAME",
                "download": "$FEED_DOWNLOAD",
                ${DOWNLOAD_SF_LINE}
                "timestamp": $OTA_TS,
                "md5": "$(md5sum "$ZIP" | cut -d' ' -f1)",
                "sha256": "$SHA256",
                "size": $SIZE_BYTES,
                "version": "$VERSION",
                "buildtype": "userdebug",
                "forum": "https://github.com/Loukious/crave_aosp_builder/discussions",
                "firmware": "https://sourceforge.net/projects/${SF_PROJECT}/files/",
                "paypal": "https://buymeacoffee.com/loukious",
                "github": "Loukious"
              }
            ]
          }
          EOF

            # Feed-repo push: shallow clone just the ota/ file's branch, swap
            # the file, push. --depth 1 keeps the devspace footprint tiny.
            # Follows PATCHES_BRANCH so A17 (cnb) builds update the cnb feed
            # and A16 (bka) dispatches update the bka feed -- never mixed.
            FEED_BRANCH="${PATCHES_BRANCH}"
            OTA_REPO="$(mktemp -d)"
            if git clone -q --depth 1 -b "$FEED_BRANCH" \
                 "https://${GITHUB_ACTOR}:${PATCHES_TOKEN}@github.com/${PATCHES_SLUG}.git" \
                 "$OTA_REPO"; then
              cp "$OTA" "$OTA_REPO/ota/onyx.json"
              git -C "$OTA_REPO" -c user.name="onyx-ci" -c user.email="ci@users.noreply.github.com" \
                commit -qm "ota: onyx build $(date -u +%Y-%m-%d) ($VERSION)" -- ota/onyx.json
              if git -C "$OTA_REPO" push -q origin "$FEED_BRANCH" 2>/dev/null; then
                echo "OTA feed updated: https://raw.githubusercontent.com/${PATCHES_SLUG}/${FEED_BRANCH}/ota/onyx.json"
              else
                # A concurrent publish raced us to the feed. Rebase and retry once.
                git -C "$OTA_REPO" pull -q --rebase origin "$FEED_BRANCH" 2>/dev/null || true
                git -C "$OTA_REPO" push -q origin "$FEED_BRANCH" \
                  || echo "::warning::OTA feed push failed (race or permissions) -- update ota/onyx.json manually"
              fi
            else
              echo "::warning::could not clone ${PATCHES_SLUG} -- OTA feed not updated"
            fi
            rm -rf "$OTA_REPO" "$OTA"
          else
            echo "::warning::neither FileDitch nor SourceForge upload produced a URL -- OTA feed not updated. Set the PATCHES_TOKEN secret (repo+workflow scoped PAT) to enable."
          fi

          # ---- GitHub release: checksum + link, never the 4.7 GB zip ------
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          Unofficial Evolution X 16.0 (Android 16, \`bka\`) for onyx (POCO F7). Built by Loukious.
          Not an official Evolution X release and not eligible for Evolution X support.

          LHDC A2DP codec, gesture navigation space, Google AI Wallpapers fix,
          Pixel lockscreen Now Playing, Kono-Ha GKI kernel with KernelSU Next
          (charging bypass off), OS3.0.302.0 firmware.

          ### Download

          - \`${NAME}\` (${SIZE}) -- fast mirror (FileDitch; open in a browser):
            ${FD_URL:-$SF_URL}
          - Permanent archive on SourceForge (GitHub caps release assets at 2 GiB):
            $SF_URL
          - sha256: \`${SHA256}\`

          Built from Evolution X \`bka\` HEAD by [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF

          "$GH" release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Evolution X 16.0 - onyx - $(date -u +%Y-%m-%d)" \
            --notes-file "$NOTES" \
            || echo "release $TAG already exists, uploading into it"
          rm -f "$NOTES"

          "$GH" release upload "$TAG" \
            --repo "${{ github.repository }}" --clobber \
            "$ZIP.sha256"

      # "Be mindful of Devspace CLI Storage. Clean up your .zip and .img build
      # artefacts if you're used to pulling them to devspace" -- crave rules.
      # Note this only removes what we pulled *to the devspace*; the build
      # server's out/ is left alone so the next build stays incremental.
      - name: Remove the pulled artifacts from the devspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/artifacts"
