name: Start/Restart Selfhosted Runner
on:
  workflow_dispatch:

jobs:
  run-devspace-and-tmux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

      # Install 'tmux'
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y tmux

      # Download and configure 'crave'.
    - name: Configure the 'crave' environment
      run: |
        if [[ $DCDEVSPACE == *1* ]]; then
        echo 'No need to set up crave, we are already running in devspace!'
        else
          mkdir ${HOME}/bin/
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ${PWD}/crave ${HOME}/bin/
          sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
          envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
          rm -rf ${PWD}/crave.conf.sample          
        fi
      env:
        CRAVE_USERNAME: ${{  secrets.CRAVE_USERNAME  }}
        CRAVE_TOKEN: ${{  secrets.CRAVE_TOKEN  }}

      # Start 'runner' in 'tmux'.
    - name: Run crave devspace
      run: |
          # Delegated to scripts/ensure-runner.sh with FORCE=1. The inline
          # version used to do `tmux new-session -d -s ghactions` and then
          # send-keys a *relative* ./actions-runner/run.sh -- which fails in a
          # devspace whose .bashrc cds to /crave-devspaces, because the pane
          # then starts there rather than in $HOME. The script sets the pane's
          # start directory explicitly.
          crave -n ${{ secrets.CRAVE_FLAGS }} devspace -- \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/ensure-runner.sh | FORCE=1 bash"
